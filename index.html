<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Проверь своё чтение Корана</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --em:#0f3d33; --em2:#175846; --em3:#0a2a23;
  --gold:#c9a14a; --gold2:#ecd593;
  --paper:#fbf4e2; --paper2:#f1e3c3; --ink:#1d1b17;
  --ok:#1b7f45; --bad:#c0392b; --skip:#b9770e;
  --ar:'Amiri Quran','Amiri','Scheherazade New','Traditional Arabic',serif;
  --hd:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--em3);color:#f6efdc;
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><g fill='none' stroke='%23c9a14a' stroke-opacity='.10' stroke-width='1'><rect x='14' y='14' width='36' height='36'/><rect x='14' y='14' width='36' height='36' transform='rotate(45 32 32)'/><circle cx='32' cy='32' r='9'/></g></svg>"),
    radial-gradient(120% 70% at 50% 0%,var(--em2) 0%,var(--em) 55%,var(--em3) 100%);
  background-attachment:fixed;
}
.screen{min-height:100%;padding:max(14px,env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom))}
.hidden{display:none!important}

/* ---------- главная ---------- */
.hero{text-align:center;padding:10px 6px 4px}
.hero .ar{font-family:var(--ar);font-size:34px;color:var(--gold2);line-height:1.6;margin:0}
.hero h1{font-family:var(--hd);font-size:27px;margin:2px 0 6px;color:#fff;letter-spacing:.3px}
.motiv{margin:8px auto 14px;max-width:420px;font-size:14px;line-height:1.5;color:#d9e6df;
  background:rgba(255,255,255,.06);border:1px solid rgba(201,161,74,.35);border-radius:14px;padding:10px 14px}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(201,161,74,.4);
  background:rgba(0,0,0,.25);color:#fff;font-size:16px;outline:none;margin-bottom:12px}
.search::placeholder{color:#9db8ae}
.list{display:flex;flex-direction:column;gap:9px}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:inherit;font:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));
  border:1px solid rgba(201,161,74,.35);border-radius:16px;padding:10px 12px;cursor:pointer}
.card:active{transform:scale(.99)}
.num{flex:none;width:44px;height:44px;display:grid;place-items:center;position:relative;
  font-family:var(--hd);font-weight:700;font-size:17px;color:var(--em)}
.num::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--gold2),var(--gold));
  transform:rotate(45deg) scale(.72);border-radius:6px;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.num::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--gold2),var(--gold));
  border-radius:6px;transform:scale(.72)}
.num span{position:relative;z-index:2}
.meta{flex:1;min-width:0}
.meta b{display:block;font-size:16px;color:#fff}
.meta small{color:#a9c2b8;font-size:12.5px}
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0}
.arn{font-family:var(--ar);font-size:24px;color:var(--gold2);white-space:nowrap}
.pct{font-size:12px;color:var(--gold2);margin-left:2px}

/* ---------- читалка ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:2px 2px 10px}
.back{border:1px solid rgba(201,161,74,.5);background:rgba(0,0,0,.25);color:var(--gold2);
  border-radius:12px;padding:8px 12px;font-size:14px;cursor:pointer}
.top-title{flex:1;text-align:center;font-family:var(--hd);font-size:19px;color:#fff}
.hintbtn{border:1px solid rgba(201,161,74,.5);background:rgba(0,0,0,.25);color:var(--gold2);
  border-radius:12px;padding:8px 10px;font-size:13px;cursor:pointer}
.hintbtn.on{background:var(--gold);color:var(--em)}

.page{position:relative;color:var(--ink);border-radius:6px 16px 16px 6px;
  padding:22px 16px 30px;margin:0 2px;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .34 0 0 0 0 .18 0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    radial-gradient(130% 90% at 50% 0%,#fffaf0 0%,var(--paper) 45%,var(--paper2) 100%);
  box-shadow:0 18px 40px rgba(0,0,0,.55), inset 14px 0 18px -12px rgba(80,50,10,.55), inset -3px 0 6px -3px rgba(80,50,10,.3);
}
.page::before{content:"";position:absolute;inset:7px;border:2px solid var(--gold);border-radius:4px 11px 11px 4px;pointer-events:none}
.page::after{content:"";position:absolute;inset:12px;border:1px solid var(--em2);border-radius:3px 9px 9px 3px;pointer-events:none;opacity:.7}
.cart{position:relative;margin:6px 6px 14px;padding:12px 8px 10px;text-align:center;border-radius:12px;
  background:linear-gradient(180deg,var(--em2),var(--em));border:2px solid var(--gold);
  box-shadow:inset 0 0 0 3px rgba(236,213,147,.25)}
.cart .t{font-family:var(--ar);font-size:34px;color:var(--gold2);line-height:1.6}
.cart small{display:block;color:#cfe3da;font-size:12.5px;letter-spacing:.3px}
.bism{font-family:var(--ar);text-align:center;font-size:27px;margin:4px 0 12px;color:#2a2418;direction:rtl}
.text{direction:rtl;text-align:justify;text-align-last:center;font-family:var(--ar);
  font-size:clamp(25px,7vw,34px);line-height:2.35;padding:0 6px;word-spacing:2px}
.w{opacity:0;transition:opacity .45s ease,color .3s;display:inline}
.hint .w{opacity:.17}
.w.ok{opacity:1;color:#1d1b17}
.w.bad{opacity:1;color:var(--bad);text-decoration:underline wavy var(--bad);text-underline-offset:7px;cursor:pointer}
.w.skip{opacity:1;color:var(--skip);text-decoration:underline dotted var(--skip);text-underline-offset:7px}
.end{display:inline-grid;place-items:center;width:1.25em;height:1.25em;margin:0 .15em;font-size:.58em;
  border:1.5px solid var(--gold);border-radius:50%;color:var(--em);font-family:var(--ar);
  opacity:0;transition:opacity .5s;vertical-align:middle;direction:ltr;background:rgba(201,161,74,.12)}
.end.on{opacity:1}
.empty{direction:ltr;text-align:center;color:#8a7a55;font:italic 15px var(--hd),serif;margin:0 0 6px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(10,42,35,0),rgba(10,42,35,.92) 28%);backdrop-filter:blur(6px)}
.stats{display:flex;justify-content:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chip{background:rgba(0,0,0,.35);border:1px solid rgba(201,161,74,.4);border-radius:999px;padding:5px 12px;font-size:13px;color:#e9f1ed}
.chip b{color:var(--gold2)}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:420px;margin:0 auto;
  border:0;border-radius:18px;padding:15px;font-size:18px;font-weight:700;cursor:pointer;color:var(--em);
  background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 8px 22px rgba(0,0,0,.45)}
.go.rec{background:linear-gradient(180deg,#e86a5c,#c0392b);color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,106,92,.55)}100%{box-shadow:0 0 0 18px rgba(232,106,92,0)}}
.row2{display:flex;gap:8px;justify-content:center;margin-top:8px}
.link{background:none;border:0;color:#a9c2b8;font-size:13px;text-decoration:underline;cursor:pointer;padding:4px 8px}
.warn{margin:0 auto 10px;max-width:420px;background:rgba(192,57,43,.18);border:1px solid rgba(232,106,92,.5);
  border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.45;color:#ffd9d3;text-align:center}

/* ---------- итог ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.box{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:linear-gradient(180deg,#134a3e,#0d352c);
  border:1px solid var(--gold);border-bottom:0;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  animation:up .35s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.ring{width:132px;height:132px;margin:0 auto 6px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hd);font-size:34px;font-weight:700;color:#fff}
.box h2{font-family:var(--hd);text-align:center;margin:4px 0 2px;font-size:22px}
.sub{text-align:center;color:#b8d0c6;font-size:13.5px;margin-bottom:10px}
.mot{background:rgba(236,213,147,.12);border:1px solid rgba(236,213,147,.4);border-radius:14px;padding:12px 14px;
  font-size:15px;line-height:1.5;color:#fff6d8;margin:10px 0}
.errs{margin:8px 0;padding:0;list-style:none}
.errs li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.1);font-size:13.5px}
.errs .a{font-family:var(--ar);font-size:22px;color:var(--gold2)}
.errs .h{font-family:var(--ar);font-size:20px;color:#ff9a8d}
.btns{display:flex;gap:10px;margin-top:14px}
.btns button{flex:1;padding:13px;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;border:1px solid var(--gold)}
.b1{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--em)}
.b2{background:transparent;color:var(--gold2)}
#toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);z-index:80;
  background:rgba(0,0,0,.85);color:#fff;border:1px solid var(--gold);border-radius:12px;padding:9px 14px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.loading{text-align:center;color:#a9c2b8;padding:30px}
.live{direction:rtl;font-family:var(--ar);font-size:19px;color:#cfe3da;text-align:center;min-height:28px;margin-bottom:6px;opacity:.9;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.go:disabled{opacity:.6}
</style>
</head>
<body>

<section id="home" class="screen">
  <div class="hero">
    <p class="ar">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>
    <h1>Проверь своё чтение</h1>
    <div class="motiv" id="motiv"></div>
  </div>
  <input class="search" id="q" type="search" placeholder="Поиск: номер или название суры" autocomplete="off">
  <div class="list" id="list"><div class="loading">Загружаю список сур…</div></div>
</section>

<section id="reader" class="screen hidden">
  <div class="topbar">
    <button class="back" id="back">‹ Суры</button>
    <div class="top-title" id="ttl"></div>
    <button class="hintbtn" id="hint">👁 Подсказка</button>
  </div>
  <div class="page" id="pg">
    <div class="cart"><div class="t" id="cAr"></div><small id="cSub"></small></div>
    <div class="bism" id="bism">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
    <p class="empty" id="empty">Нажмите «Начать» и читайте суру вслух — аяты проявятся на странице</p>
    <div class="text" id="txt"></div>
  </div>
</section>

<div class="dock hidden" id="dock">
  <div class="warn hidden" id="warn"></div>
  <div class="live" id="live"></div>
  <div class="stats">
    <span class="chip">Прочитано <b id="sProg">0%</b></span>
    <span class="chip">Точность <b id="sAcc">—</b></span>
    <span class="chip">Ошибок <b id="sErr">0</b></span>
  </div>
  <button class="go" id="go">🎙 Начать</button>
  <div class="row2">
    <button class="link" id="demo">Демо без микрофона</button>
    <button class="link hidden" id="ext">Открыть в браузере</button>
  </div>
</div>

<div class="sheet hidden" id="sheet"><div class="box" id="box"></div></div>
<div id="toast"></div>

<script>
/* ===================== Telegram ===================== */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  try { tg.ready(); tg.expand(); tg.setHeaderColor('#0f3d33'); tg.setBackgroundColor('#0a2a23'); } catch (e) {}
  try { tg.disableVerticalSwipes(); } catch (e) {}
}
const haptic = (t) => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const hapticL = () => { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };

/* ===================== утилиты ===================== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const toAr = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const API = 'https://api.alquran.cloud/v1';
const API2 = 'https://api.quran.com/api/v4';
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2800); }
function store(k, v) {
  try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; }
}
let lastErr = 0;
function reportErr(m) { const t = Date.now(); console.error(m); if (t - lastErr > 4000) { lastErr = t; toast('⚠️ ' + m); } }
window.addEventListener('error', (e) => reportErr(e.message || 'ошибка'));
window.addEventListener('unhandledrejection', (e) => reportErr((e.reason && e.reason.message) || String(e.reason)));

const MOTIV = [
  'Читайте понемногу, но каждый день: регулярность важнее объёма.',
  'Ошибка — это не провал, а подсказка, что повторить в следующий раз.',
  'Выучить суру легче по одному аяту: повторите его пять раз и переходите дальше.',
  'Читайте медленно и чётко: скорость придёт сама, когда текст станет привычным.',
  'Сегодняшний труд — завтрашняя уверенность. Начните с короткой суры.',
  'Не сравнивайте себя с другими: сравнивайте с собой вчерашним.',
];

/* ===================== нормализация и сравнение ===================== */
const MARKS = /[\u0610-\u061A\u064B-\u065F\u06D6-\u06ED\u0640\u08D3-\u08FF]/g;
function norm(s, daggerAsAlef) {
  if (daggerAsAlef) s = s.replace(/\u0670/g, '\u0627');
  s = s.replace(/\u0670/g, '').replace(MARKS, '');
  return s.replace(/[\u0671\u0623\u0625\u0622]/g, '\u0627').replace(/\u0649/g, '\u064A').replace(/\u0629/g, '\u0647')
    .replace(/\u0624/g, '\u0648').replace(/\u0626/g, '\u064A').replace(/\u0621/g, '')
    .replace(/\u06CC/g, '\u064A').replace(/\u06A9/g, '\u0643')
    .replace(/[^\u0621-\u063A\u0641-\u064A]/g, '');
}
function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const simStr = (a, b) => (!a.length && !b.length) ? 1 : 1 - lev(a, b) / Math.max(a.length, b.length);
const simW = (r, w) => Math.max(simStr(r, w.a), simStr(r, w.b));
const tokenize = (t) => String(t || '').split(/\s+/).map((x) => norm(x, false)).filter(Boolean);
const OK = 0.82;

/* Сопоставление услышанных слов с текстом суры (считается с нуля при каждом обновлении).
   status: 0 — ещё не прочитано, 1 — верно, 2 — ошибка, 3 — пропущено */
function evaluate(words, rec, surahNo, tentativeLast) {
  const n = words.length, status = new Array(n).fill(0), heard = new Array(n).fill('');
  let r = rec;
  if (surahNo !== 1 && surahNo !== 9 && r.length && simStr(r[0], 'بسم') >= 0.7) r = r.slice(Math.min(4, r.length));
  let pos = 0;
  for (let i = 0; i < r.length && pos < n; i++) {
    const w = r[i], isLast = tentativeLast && i === r.length - 1;
    const s0 = simW(w, words[pos]);
    if (s0 >= OK) { status[pos] = 1; heard[pos] = w; pos++; continue; }
    // два слова слились в одно
    if (pos + 1 < n && simStr(w, words[pos].a + words[pos + 1].a) >= 0.86) {
      status[pos] = status[pos + 1] = 1; heard[pos] = heard[pos + 1] = w; pos += 2; continue;
    }
    // одно слово распалось на два
    if (i + 1 < r.length && simW(w + r[i + 1], words[pos]) >= 0.86) {
      status[pos] = 1; heard[pos] = w + ' ' + r[i + 1]; pos++; i++; continue;
    }
    // пропущены слова: ищем совпадение впереди
    let jumped = false;
    for (let k = 1; k <= 6 && pos + k < n; k++) {
      if (k > 2 && words[pos + k].a.length < 4) continue;
      if (simW(w, words[pos + k]) >= (k <= 2 ? 0.8 : 0.88)) {
        for (let q = pos; q < pos + k; q++) status[q] = 3;
        status[pos + k] = 1; heard[pos + k] = w; pos += k + 1; jumped = true; break;
      }
    }
    if (jumped) continue;
    if (isLast) break;                                         // слово ещё произносится
    if (pos > 0 && simW(w, words[pos - 1]) >= 0.9) continue;   // повтор предыдущего слова
    if (s0 >= 0.45) { status[pos] = 2; heard[pos] = w; pos++; }
  }
  return { status, heard, pos };
}

/* ===================== состояние ===================== */
let surahs = [], cur = null, words = [], ayahEnd = [], ev = { status: [], heard: [], pos: 0 }, prevStatus = [];
let wordEls = [], endEls = [], running = false, flushing = false, finished = false, demoTimer = null;
let mode = null, rec = null, finalWords = [], interimWords = [], restartTimes = [], srFailed = false, sttServer = false;
let stream = null, mr = null, chunkTimer = null, chain = Promise.resolve(), actx = null, analyser = null, maxLvl = 0, lvlTimer = null, srvErr = 0;
let hintOn = false, lastScroll = 0, wakeLock = null;

/* ===================== загрузка данных (с запасным источником) ===================== */
async function jget(url, tries = 2) {
  let err;
  for (let i = 0; i < tries; i++) {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
    try {
      const r = await fetch(url, { signal: ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) { err = e; await sleep(400); } finally { clearTimeout(t); }
  }
  throw err;
}
async function fetchList() {
  try {
    const a = (await jget(API + '/surah')).data.map((s) => ({ n: s.number, ar: s.name, en: s.englishName, tn: s.englishNameTranslation, c: s.numberOfAyahs }));
    if (a.length === 114) return a;
    throw new Error('bad list');
  } catch (e) {
    const j = await jget(API2 + '/chapters?language=en');
    return j.chapters.map((c) => ({ n: c.id, ar: 'سورة ' + c.name_arabic, en: c.name_simple, tn: (c.translated_name && c.translated_name.name) || '', c: c.verses_count }));
  }
}
async function fetchSurah(n, count) {
  try {
    const a = (await jget(`${API}/surah/${n}/quran-uthmani`)).data.ayahs.map((x) => x.text);
    if (a.length === count) return a;
    throw new Error('bad surah');
  } catch (e) {
    const j = await jget(`${API2}/quran/verses/uthmani?chapter_number=${n}`);
    const a = j.verses.map((v) => v.text_uthmani);
    if (!a.length) throw new Error('empty');
    return a;
  }
}

/* ===================== главная ===================== */
$('motiv').textContent = MOTIV[Math.floor(Math.random() * MOTIV.length)];

async function loadList() {
  $('list').innerHTML = '<div class="loading">Загружаю список сур…</div>';
  try {
    surahs = store('sl2');
    if (!surahs || surahs.length !== 114) { surahs = await fetchList(); store('sl2', surahs); }
    renderList();
  } catch (e) {
    $('list').innerHTML = '<div class="loading">Не удалось загрузить список сур.<br><br><button class="back" id="retry">Повторить</button></div>';
    $('retry').onclick = loadList;
  }
}
function renderList() {
  const q = $('q').value.trim().toLowerCase();
  const prog = store('qprog') || {};
  const items = surahs.filter((s) => !q || String(s.n) === q || s.en.toLowerCase().includes(q) || s.tn.toLowerCase().includes(q) || s.ar.includes(q));
  $('list').innerHTML = items.map((s) => {
    const p = (prog[s.n] && prog[s.n].learned) || 0;
    return `<button class="card" data-n="${s.n}">
      <div class="num"><span>${s.n}</span></div>
      <div class="meta"><b>${esc(s.en)}</b><small>${esc(s.tn)} · аятов: ${s.c}</small>
        <div class="bar"><i style="width:${p}%"></i></div></div>
      <div style="text-align:right"><div class="arn">${esc(s.ar.replace(/^سُورَةُ\s*/, '').replace(/^سورة\s*/, ''))}</div>
        <span class="pct">${p ? 'выучено ' + p + '%' : ''}</span></div></button>`;
  }).join('') || '<div class="loading">Ничего не найдено</div>';
}
$('q').addEventListener('input', renderList);
$('list').addEventListener('click', (e) => { const c = e.target.closest('.card'); if (c) openSurah(+c.dataset.n); });

/* ===================== читалка ===================== */
async function openSurah(n) {
  const meta = surahs.find((s) => s.n === n);
  $('home').classList.add('hidden'); $('reader').classList.remove('hidden'); $('dock').classList.remove('hidden');
  $('ttl').textContent = `${n}. ${meta.en}`;
  $('cAr').textContent = meta.ar; $('cSub').textContent = `Сура ${n} · аятов: ${meta.c}`;
  $('bism').style.display = (n === 1 || n === 9) ? 'none' : '';
  $('txt').innerHTML = '<div class="loading">Загружаю текст…</div>'; $('empty').style.display = 'none';
  $('go').disabled = true; window.scrollTo(0, 0);
  if (tg) { try { tg.BackButton.show(); tg.BackButton.offClick(goHome); tg.BackButton.onClick(goHome); } catch (e) {} }
  try {
    let data = store('sq2_' + n);
    if (!data || !data.length) { data = await fetchSurah(n, meta.c); store('sq2_' + n, data); }
    cur = { n, meta, ayahs: data };
    buildPage(); $('go').disabled = false;
  } catch (e) {
    $('txt').innerHTML = '<div class="loading">Не удалось загрузить текст суры.<br><br><button class="back" id="retry2">Повторить</button></div>';
    $('retry2').onclick = () => openSurah(n);
  }
}
function goHome() {
  const wasRunning = running; stopAll(); saveProgress();
  $('sheet').classList.add('hidden'); $('reader').classList.add('hidden'); $('dock').classList.add('hidden'); $('home').classList.remove('hidden');
  if (tg) { try { tg.BackButton.hide(); } catch (e) {} }
  renderList(); window.scrollTo(0, 0);
}
$('back').onclick = goHome;
$('hint').onclick = () => { hintOn = !hintOn; $('hint').classList.toggle('on', hintOn); $('txt').classList.toggle('hint', hintOn); };

function buildPage() {
  words = []; ayahEnd = [];
  cur.ayahs.forEach((text, i) => {
    let toks = String(text).trim().split(/\s+/);
    if (i === 0 && cur.n !== 1 && cur.n !== 9 && toks.length > 4 && norm(toks[0], false) === 'بسم') toks = toks.slice(4);
    const startIdx = words.length;
    toks.forEach((t) => {
      const a = norm(t, false), b = norm(t, true);
      if (!a && words.length > startIdx) { words[words.length - 1].t += ' ' + t; return; }
      if (!a) return;
      words.push({ t, a, b });
    });
    ayahEnd.push(words.length - 1);
  });
  let html = '', wi = 0;
  ayahEnd.forEach((endIdx, ai) => {
    while (wi <= endIdx) { html += `<span class="w" data-i="${wi}">${esc(words[wi].t)}</span> `; wi++; }
    html += `<span class="end" data-a="${ai}">${toAr(ai + 1)}</span> `;
  });
  $('txt').innerHTML = html;
  wordEls = Array.from($('txt').querySelectorAll('.w')); endEls = Array.from($('txt').querySelectorAll('.end'));
  resetSession(); $('empty').style.display = '';
}
function resetSession() {
  finalWords = []; interimWords = []; finished = false;
  prevStatus = new Array(words.length).fill(-1);
  ev = { status: new Array(words.length).fill(0), heard: new Array(words.length).fill(''), pos: 0 };
  wordEls.forEach((el) => { el.className = 'w'; }); endEls.forEach((el) => el.classList.remove('on'));
  $('live').textContent = ''; stats();
}
function stats() {
  let ok = 0, bad = 0, skip = 0;
  ev.status.forEach((s) => { if (s === 1) ok++; else if (s === 2) bad++; else if (s === 3) skip++; });
  const done = ok + bad + skip;
  $('sProg').textContent = Math.round(ev.pos / Math.max(1, words.length) * 100) + '%';
  $('sAcc').textContent = done ? Math.round(ok / done * 100) + '%' : '—';
  $('sErr').textContent = bad + skip;
  return { ok, bad, skip, done };
}
function paint() {
  const st = ev.status;
  for (let i = 0; i < st.length; i++) {
    if (st[i] === prevStatus[i]) continue;
    prevStatus[i] = st[i];
    wordEls[i].className = 'w' + (st[i] === 1 ? ' ok' : st[i] === 2 ? ' bad' : st[i] === 3 ? ' skip' : '');
  }
  let start = 0;
  ayahEnd.forEach((e, ai) => {
    let all = true; for (let i = start; i <= e; i++) if (!st[i]) { all = false; break; }
    if (all && !endEls[ai].classList.contains('on')) { endEls[ai].classList.add('on'); hapticL(); }
    start = e + 1;
  });
  stats();
  if (ev.pos > 0) $('empty').style.display = 'none';
  const now = Date.now();
  if (ev.pos > 0 && now - lastScroll > 700) {
    lastScroll = now;
    const el = wordEls[Math.min(ev.pos, wordEls.length - 1)];
    const r = el.getBoundingClientRect();
    if (r.top < 90 || r.bottom > innerHeight - 210) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}
$('txt').addEventListener('click', (e) => {
  const w = e.target.closest('.w'); if (!w) return;
  const i = +w.dataset.i;
  if (ev.status[i] === 2) toast(`Ожидалось: ${norm(words[i].t, false)} · услышано: ${ev.heard[i]}`);
  else if (ev.status[i] === 3) toast('Это слово пропущено');
});
function update(recWords, tentative) {
  if (finished || !words.length) return;
  ev = evaluate(words, recWords, cur.n, tentative);
  paint();
  if (ev.pos >= words.length) finish();
}
function push() {
  const all = finalWords.concat(interimWords);
  $('live').textContent = all.slice(-6).join(' ');
  update(all, interimWords.length > 0);
}

/* ===================== запись и распознавание ===================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const canRecord = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
const canServer = () => sttServer && canRecord() && !!(tg && tg.initData);

async function lockScreen() { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
function unlockScreen() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }
function setRunning(on) {
  running = on;
  $('go').classList.toggle('rec', on);
  $('go').textContent = on ? '⏹ Закончить' : '🎙 Начать';
  if (on) lockScreen(); else unlockScreen();
}
function showWarn(t) { $('warn').textContent = t; $('warn').classList.toggle('hidden', !t); }
function updateExt() { $('ext').classList.toggle('hidden', !!SR || canServer()); }
updateExt();
$('ext').onclick = () => { const u = location.href.split('#')[0]; if (tg && tg.openLink) tg.openLink(u); else window.open(u, '_blank'); };
if (tg && tg.initData) {
  fetch('/api/stt').then((r) => (r.ok ? r.json() : null)).then((j) => { sttServer = !!(j && j.enabled); updateExt(); }).catch(() => {});
}

function startRec() {
  if (!cur || !words.length) return;
  showWarn('');
  const useSR = !!SR && !srFailed;
  if (!useSR && !canServer()) {
    showWarn('Распознавание речи не работает внутри Telegram на этом устройстве. Нажмите «Открыть в браузере» (Chrome или Safari) или посмотрите «Демо».');
    return;
  }
  resetSession(); $('empty').style.display = 'none';
  if (useSR) startSR(); else startServer();
}
function startSR() {
  mode = 'sr'; restartTimes = [];
  rec = new SR(); rec.lang = 'ar-SA'; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalWords.push(...tokenize(t)); else interim += ' ' + t;
    }
    interimWords = tokenize(interim);
    push();
  };
  rec.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    const fatal = ['not-allowed', 'service-not-allowed', 'language-not-supported', 'network'].includes(e.error);
    if (fatal && canServer()) { srFailed = true; stopAll(); showWarn('Переключаюсь на распознавание через сервер…'); startServer(); return; }
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') showWarn('Нет доступа к микрофону или к службе распознавания. Разрешите микрофон или откройте приложение в браузере.');
    else if (e.error === 'network') showWarn('Нет связи со службой распознавания речи.');
    else showWarn('Ошибка распознавания: ' + e.error);
    if (fatal) stopAll();
  };
  rec.onend = () => {
    if (!running || mode !== 'sr') return;
    if (interimWords.length) { finalWords.push(...interimWords); interimWords = []; }
    const now = Date.now(); restartTimes = restartTimes.filter((t) => now - t < 10000); restartTimes.push(now);
    if (restartTimes.length > 8) { showWarn('Распознавание постоянно прерывается. Попробуйте открыть приложение в браузере.'); stopAll(); return; }
    setTimeout(() => { if (running && mode === 'sr') { try { rec.start(); } catch (e) {} } }, 250);
  };
  try { rec.start(); setRunning(true); } catch (e) { showWarn('Не удалось включить микрофон.'); }
}

/* режим «через сервер»: запись кусками по 7 секунд и отправка боту на распознавание */
function pickMime() {
  const list = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  try { return list.find((m) => MediaRecorder.isTypeSupported(m)) || ''; } catch (e) { return ''; }
}
async function startServer() {
  mode = 'srv'; srvErr = 0; chain = Promise.resolve(); flushing = false;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) { showWarn('Нет доступа к микрофону. Разрешите его в настройках.'); mode = null; return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext; actx = new AC();
    const src = actx.createMediaStreamSource(stream); analyser = actx.createAnalyser(); analyser.fftSize = 1024; src.connect(analyser);
    const buf = new Uint8Array(analyser.fftSize);
    lvlTimer = setInterval(() => { analyser.getByteTimeDomainData(buf); let m = 0; for (const v of buf) m = Math.max(m, Math.abs(v - 128) / 128); if (m > maxLvl) maxLvl = m; }, 100);
  } catch (e) { analyser = null; }
  setRunning(true); nextChunk();
}
function nextChunk() {
  if (!running || !stream || flushing) return;
  const mime = pickMime(); maxLvl = 0;
  let rr;
  try { rr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); }
  catch (e) { showWarn('Запись звука не поддерживается на этом устройстве.'); stopAll(); return; }
  mr = rr; const parts = [];
  rr.ondataavailable = (e) => { if (e.data && e.data.size) parts.push(e.data); };
  rr.onstop = () => {
    const lvl = maxLvl, blob = new Blob(parts, { type: rr.mimeType || mime || 'audio/webm' });
    if (blob.size > 3000 && (!analyser || lvl > 0.04)) chain = chain.then(() => sendChunk(blob)).catch(() => {});
    if (running && !flushing) nextChunk();
  };
  rr.start();
  chunkTimer = setTimeout(() => { if (rr.state !== 'inactive') rr.stop(); }, 7000);
}
async function sendChunk(blob) {
  try {
    const r = await fetch('/api/transcribe', { method: 'POST', headers: { 'Content-Type': blob.type || 'audio/webm', 'X-Init-Data': tg.initData }, body: blob });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (j.text) { finalWords.push(...tokenize(j.text)); push(); }
  } catch (e) { if (++srvErr <= 2) showWarn('Сервер распознавания недоступен: ' + e.message); }
}
async function stopServerAndFinish() {
  flushing = true; $('go').disabled = true; $('go').textContent = '⏳ Обрабатываю…';
  clearTimeout(chunkTimer);
  if (mr && mr.state !== 'inactive') { try { mr.stop(); } catch (e) {} }
  await sleep(400); await chain;
  flushing = false; $('go').disabled = false; stopAll(); finish();
}

function stopAll() {
  const had = running;
  running = false; setRunning(false);
  clearTimeout(chunkTimer); clearInterval(lvlTimer); lvlTimer = null;
  if (rec) { rec.onend = null; rec.onresult = null; rec.onerror = null; try { rec.stop(); } catch (e) {} rec = null; }
  if (mr && mr.state !== 'inactive') { try { mr.onstop = null; mr.stop(); } catch (e) {} }
  mr = null;
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  if (actx) { try { actx.close(); } catch (e) {} actx = null; }
  analyser = null;
  if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  mode = null;
  return had;
}
$('go').onclick = () => {
  if (running) { if (mode === 'srv') stopServerAndFinish(); else { stopAll(); finish(); } }
  else startRec();
};

/* Демо: имитация чтения с ошибками, чтобы посмотреть дизайн без микрофона */
$('demo').onclick = () => {
  if (running || !cur || !words.length) return;
  resetSession(); $('empty').style.display = 'none'; mode = 'demo'; setRunning(true);
  let i = 0; const out = [];
  demoTimer = setInterval(() => {
    if (i >= words.length) { clearInterval(demoTimer); demoTimer = null; return; }
    let w = words[i].a;
    if (i % 11 === 6 && w.length > 3) w = w.slice(0, -2) + 'ز';
    if (i % 17 === 9 && w.length > 3) i++;
    out.push(w); i++;
    $('live').textContent = out.slice(-6).join(' ');
    update(out.slice(), false);
  }, 260);
};

/* ===================== итог ===================== */
function saveProgress() {
  if (!cur || !words.length) return null;
  const { ok, done } = stats();
  if (!done) return null;
  const acc = Math.round(ok / done * 100), learned = Math.round(ok / words.length * 100);
  const prog = store('qprog') || {}, old = prog[cur.n] || {};
  prog[cur.n] = { learned: Math.max(old.learned || 0, learned), acc: Math.max(old.acc || 0, acc), ts: Date.now() };
  store('qprog', prog);
  return { acc, learned, best: prog[cur.n].learned };
}
function motivation(acc, complete) {
  if (!complete && acc >= 85) return 'Прекрасное начало! Продолжайте с того места, где остановились: чтение по частям помогает быстрее закрепить суру.';
  if (acc >= 95) return 'Маша’Аллах! Чтение почти безупречное. Повторяйте регулярно, и сура останется в памяти надолго.';
  if (acc >= 80) return 'Очень хороший результат! Ещё пара повторений — и ошибки уйдут. Вы на верном пути.';
  if (acc >= 50) return 'Хорошая работа! Разберите красные слова, прочитайте их медленно несколько раз и попробуйте снова. Каждое повторение делает чтение увереннее.';
  return 'Любой путь начинается с первого шага, и вы его сделали. Читайте по одному аяту, повторяйте вслух и возвращайтесь: у вас получится!';
}
function finish() {
  if (finished) return;
  const wasRunning = stopAll();
  const { ok, bad, skip, done } = stats();
  if (!done) { if (wasRunning) toast('Пока ничего не распознано. Читайте громче и ближе к микрофону.'); return; }
  finished = true;
  const sv = saveProgress();
  const read = Math.round(ev.pos / words.length * 100);
  haptic(sv.acc >= 80 ? 'success' : 'warning');
  const errs = [];
  ev.status.forEach((s, i) => { if (s === 2 || s === 3) errs.push({ i, s }); });
  const C = 2 * Math.PI * 56;
  $('box').innerHTML = `
    <div class="ring"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="56" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="10"/>
      <circle cx="66" cy="66" r="56" fill="none" stroke="#ecd593" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - sv.acc / 100)}"/></svg><div class="c">${sv.acc}%</div></div>
    <h2>${esc(cur.meta.en)}: точность чтения</h2>
    <div class="sub">Прочитано ${read}% суры · выучено ${sv.best}% (лучший результат)<br>Верно: ${ok} · с ошибкой: ${bad} · пропущено: ${skip}</div>
    <div class="mot">${esc(motivation(sv.acc, read >= 98))}</div>
    ${errs.length ? '<b style="font-size:14px">Над чем поработать:</b><ul class="errs">' + errs.slice(0, 15).map((x) =>
      `<li><span class="a">${esc(words[x.i].t)}</span><span class="h">${x.s === 3 ? 'пропущено' : esc(ev.heard[x.i])}</span></li>`).join('') + '</ul>' : '<div class="sub">Ошибок не найдено. Прекрасно!</div>'}
    <div class="sub" style="font-size:12px;opacity:.8">Проверка сравнивает слова, а не все правила таджвида. Для оценки таджвида читайте с наставником.</div>
    <div class="btns"><button class="b1" id="again">Повторить</button><button class="b2" id="close">К сурам</button></div>`;
  $('sheet').classList.remove('hidden');
  $('again').onclick = () => { $('sheet').classList.add('hidden'); resetSession(); $('empty').style.display = ''; window.scrollTo({ top: 0, behavior: 'smooth' }); };
  $('close').onclick = goHome;
}
$('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) $('sheet').classList.add('hidden'); });
document.addEventListener('visibilitychange', () => { if (document.hidden && running && mode !== 'demo') { if (mode === 'srv') stopServerAndFinish(); else { stopAll(); finish(); } } });

loadList();
</script>
</body>
</html>
